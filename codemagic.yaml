workflows:
  ios-unsigned-test:
    name: PromptWise iOS unsigned test build
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        - promptwise_config
      flutter: 3.38.7
      xcode: 16.4
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter clean
          flutter pub get

      - name: Analyze project
        script: |
          flutter analyze

      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Package unsigned IPA
        script: |
          rm -rf build/ios/unsigned_ipa
          mkdir -p build/ios/unsigned_ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned_ipa/Payload/
          cd build/ios/unsigned_ipa
          /usr/bin/zip -qry ../PromptWise-unsigned.ipa Payload

    artifacts:
      - build/ios/PromptWise-unsigned.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
