<div style="font-family:Arial,sans-serif;max-width:560px;margin:auto;padding:24px;color:#172033">
  <h2 style="margin:0 0 12px">Verify your PromptWise account</h2>
  <p>Enter this 6-digit code in PromptWise:</p>
  <div style="font-size:32px;font-weight:700;letter-spacing:8px;padding:16px 0">{{ .Token }}</div>
  <p>This code is for {{ .Email }}. Use only the latest code you requested and do not share it.</p>
  <p style="font-size:13px;color:#667085">If the code entry screen is unavailable, you may use the confirmation link below.</p>
  <p><a href="{{ .ConfirmationURL }}">Confirm email</a></p>
</div>
