# PromptWise Supabase local/function configuration.
# Existing functions remain unchanged. Phase 7 content automation is invoked
# by the authenticated Admin Web client for manual checks and can also accept
# a protected scheduled trigger handled inside the function.

[functions.content-automation]
verify_jwt = false

# PromptWise Phase 8 AI Coach. The function authenticates the learner JWT
# itself before any AI request, while allowing browser preflight requests.
[functions.promptwise-integrations]
verify_jwt = false

# Phase 9 image comparison feed. The function validates the learner JWT
# itself and fetches fresh, source-labeled Wikimedia Commons examples.
[functions.verification-media]
verify_jwt = false

# Phase 9 live AI Awareness feed. The function validates the signed-in user
# itself, discovers current trusted news, and refreshes the cached feed.
[functions.awareness-feed]
verify_jwt = false

# Lesson dictionary proxy. The function validates the learner JWT itself and
# keeps browser clients independent of third-party CORS behavior.
[functions.dictionary-lookup]
verify_jwt = false
